<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/tokens/fonts.css">
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/tokens/icons.css">
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/tokens/tokens.css">
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/tokens/app-color-semantics.css">
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/components/marketing/fig-tokens.css">
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/styles.css">
<script src="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/_ds_bundle.js"></script>
<style>
html,body{margin:0;background:var(--web-bg);font-family:var(--font-body)}
a{color:var(--ink-80);text-decoration:none}a:hover{color:var(--ink)}
.btn-start{transition:background .15s ease,color .15s ease}
.btn-start:hover{background:var(--brand-purple)!important;color:var(--on-dark)!important}
@media (max-width:767px){.cta{padding:72px 20px!important;min-height:0!important}
.ctahead{font-size:28px!important}}
</style>
</helmet>
<div class="cta" style="background:url(assets/sub-footer.jpg) center bottom / cover no-repeat,var(--web-gradient-footer);text-align:center;padding:110px 40px;min-height:450px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div class="ctahead" style="font-family:var(--font-display);font-size:40px;font-weight:400;line-height:1.15;color:var(--on-dark)">{{ heading }}</div>
<a class="btn-start" href="https://calendar.app.google/AwUNqYVrSpUf1XeK8" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;background:var(--brand-mint);color:#212121CC;border-radius:10px;padding:14px 22px;font-size:14px;font-weight:500;cursor:pointer;margin-top:32px">{{ buttonLabel }}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:450},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;See it run on your own pipeline&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;buttonLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book a walkthrough&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      heading: this.props.heading ?? 'See it run on your own pipeline',
      buttonLabel: this.props.buttonLabel ?? 'Book a Demo'
    };
  }
}
</script>
</body>
</html>
