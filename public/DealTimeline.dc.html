<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/tokens/fonts.css">
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/tokens/icons.css">
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/tokens/tokens.css">
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/tokens/app-color-semantics.css">
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/components/marketing/fig-tokens.css">
<link rel="stylesheet" href="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/styles.css">
<script src="_ds/agentpress-design-system-a7a079c6-bf40-4b95-80cd-57e0caa9d6ac/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
<style>
html,body{margin:0;background:var(--web-bg);font-family:var(--font-body)}
a{color:var(--ink-80);text-decoration:none}a:hover{color:var(--ink)}
.dt-h1{font-family:var(--font-display);font-weight:400;line-height:1.2;letter-spacing:0em;color:var(--ink)}
.dt-eyebrow{display:inline-block;font-size:12px;letter-spacing:0.03em;color:var(--ink-muted);border:1px solid var(--hairline);border-radius:999px;padding:5px 14px}
.dtstack{display:flex;align-items:stretch;min-height:480px}
.dtrow{box-sizing:border-box;flex:0 1 240px;min-width:0;overflow:hidden;border-left:1px solid var(--hairline);transition:flex-basis .55s cubic-bezier(.25,.8,.3,1),border-color .35s ease}
.dtrow.on{flex:1 1 620px;border-left-color:#814ADE}
.dtnum{display:inline-block;font-size:12px;letter-spacing:0.03em;color:var(--ink-muted);border:1px solid var(--hairline);border-radius:999px;padding:5px 14px;transition:color .35s ease,border-color .35s ease}
.dtrow.on .dtnum{color:var(--ink-80)}
.dtbody{width:100%;max-width:100%;height:0;overflow:hidden;opacity:0;transition:opacity .3s ease}
.dtrow.on .dtbody{height:auto;opacity:1;transition:opacity .5s ease .35s}
@media (prefers-reduced-motion: reduce),(max-width:900px){.dtpin{height:auto!important}
.dtstage{position:static!important;height:auto!important;display:block!important;padding:0 30px}
.dtsent{display:none}
.dtstack{flex-direction:column;min-height:0}
.dtrow{flex:none!important;border-left-color:#814ADE;overflow:visible}
.dtbody{width:auto!important;opacity:1!important}
.dtnum{color:var(--ink-80)}}
</style>
</helmet>
<div style="background-color:#FDFAF4">
<div style="margin:0 auto;text-align:center">
<object type="image/svg+xml" data="assets/hero-graphic-v4.svg" aria-label="How AgentPress works across the deal" style="width: 80%; aspect-ratio: 1400 / 711; display: block; margin: 0 auto; margin-bottom: 140px; pointer-events: none"></object>
</div>
<div class="dtpin" ref="{{ pinRef }}" style="position:relative;height:500vh;margin:0">
<sc-for list="{{ steps }}" as="step" hint-placeholder-count="5">
<div class="dtsent" data-sentinel="{{ $index }}" style="position:absolute;left:0;width:1px;height:100vh;pointer-events:none"></div>
</sc-for>
<div class="dtstage" style="position:sticky;top:clamp(120px,18vh,200px);display:flex;align-items:flex-start;justify-content:center;padding:0 48px 140px">
<div style="width:100%;max-width:1800px">
<div class="dt-h1" style="font-size: 30px; color: #212121; text-align: left; margin-bottom: 80px">The AgentPress time machine</div>
<div class="dtstack">
<sc-for list="{{ steps }}" as="step" hint-placeholder-count="5">
<div class="dtrow" data-step="{{ $index }}" onClick="{{ step.onSelect }}" style="padding:4px 40px 4px 34px;cursor:pointer">
<span class="dtnum">{{ step.num }}</span>
<h2 class="dt-h1 dttitle" style="font-size: 22px; margin: 16px 0 0; max-width: 340px">{{ step.title }}</h2>
<div class="dtbody">
<p style="font-size:16px;line-height:1.6;color:var(--ink-body);margin:22px 0 0">{{ step.body }}</p>
<image-slot id="{{ step.imgId }}" src="{{ step.imgSrc }}" shape="rounded" radius="16" placeholder="{{ step.imgPlaceholder }}" style="width: 100%; height: min(480px,54vh); display: block; margin-top: 40px; border: 1px solid var(--hairline); border-radius: 16px; overflow: hidden; box-sizing: border-box"></image-slot>
</div>
</div>
</sc-for>
</div>
</div>
</div>
</div>

</div></x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  pinRef = React.createRef();
  steps() {
    return [
      { label: 'Opportunity lands', eyebrow: 'Meridian Health \u00b7 Step 1 of 5', title: 'An opportunity lands',
        body: "The moment a deal moves into your pipeline, AgentPress reconstructs the full picture. It pulls context from email threads, call transcripts, and existing CRM records so nothing has to be re-entered by hand.",
        imgId: 'shot-1', imgSrc: 'uploads/slot-shot-1.webp', imgPlaceholder: 'Opportunity overview screenshot' },
      { label: 'Before the meeting', eyebrow: 'Meridian Health \u00b7 Step 2 of 5', title: 'Before the meeting',
        body: "Ahead of every call, AgentPress prepares a brief with discovery questions and relevant company intel. It also builds a deck in the buyer's own brand and sets up a roleplay so the rep can practice the conversation first.",
        imgId: 'shot-2', imgSrc: '', imgPlaceholder: 'Meeting prep brief screenshot' },
      { label: 'After the meeting', eyebrow: 'Meridian Health \u00b7 Step 3 of 5', title: 'After the meeting',
        body: "As soon as the call ends, AgentPress reviews the transcript and captures what was said. Pain points, objections, commitments, and the stakeholders in the room are logged without anyone taking notes.",
        imgId: 'shot-3', imgSrc: '', imgPlaceholder: 'Post-call capture screenshot' },
      { label: 'Building the case', eyebrow: 'Meridian Health \u00b7 Step 4 of 5', title: 'Building the case',
        body: "AgentPress turns what it's learned into a value model and a business case built on the buyer's own numbers. Both live in a deal room the buyer can actually open and use, not a PDF that sits in an inbox.",
        imgId: 'shot-4', imgSrc: '', imgPlaceholder: 'Deal room screenshot' },
      { label: 'Keeping it moving', eyebrow: 'Meridian Health \u00b7 Step 5 of 5', title: 'Keeping it moving',
        body: "AgentPress tracks deal health and recommends the next-best action at every stage. When a deal goes quiet, it sends a proactive nudge before the rep has to notice on their own.",
        imgId: 'shot-5', imgSrc: '', imgPlaceholder: 'Deal health dashboard screenshot' }
    ];
  }
  renderVals() {
    const steps = this.steps().map((s, i) => ({
      ...s,
      num: String(i + 1).padStart(2, '0'),
      onSelect: () => this.goTo(i)
    }));
    return { steps, pinRef: this.pinRef };
  }
  goTo(i) {
    const wrap = this.pinRef.current; if (!wrap) return;
    const vh = window.innerHeight;
    const total = wrap.offsetHeight - vh;
    if (total <= 0) return;
    const n = this.steps().length;
    const top = wrap.offsetTop + total * ((i + 0.5) / n);
    window.scrollTo({ top, behavior: 'smooth' });
  }
  componentDidMount() {
    const wrap = this.pinRef.current; if (!wrap) return;
    const n = this.steps().length;
    wrap.style.height = ((n * 70) + 100) + 'vh';
    const sents = [].slice.call(wrap.querySelectorAll('.dtsent'));
    sents.forEach((s, i) => { s.style.top = (i * 100) + 'vh'; });
    const mq = window.matchMedia('(prefers-reduced-motion: reduce), (max-width: 900px)');
    if (mq.matches) return;
    const rows = [].slice.call(wrap.querySelectorAll('.dtrow'));
    const setStep = i => {
      rows.forEach(r => r.classList.toggle('on', +r.dataset.step === i));
    };
    setStep(0);
    let ticking = false;
    const update = () => {
      ticking = false;
      const rect = wrap.getBoundingClientRect();
      const vh = window.innerHeight;
      const total = rect.height - vh;
      const scrolled = -rect.top;
      const progress = total > 0 ? Math.min(1, Math.max(0, scrolled / total)) : 0;
      const idx = Math.min(n - 1, Math.floor(progress * n));
      setStep(idx);
    };
    this.onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll);
    update();
  }
  componentWillUnmount() {
    if (this.onScroll) { window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onScroll); }
  }
}
</script>
</body>
</html>
