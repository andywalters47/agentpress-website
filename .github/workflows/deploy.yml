name: Deploy website to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentpress-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment scripts
        run: for script in ops/deploy/*.sh; do bash -n "$script"; done
      - name: Build production release and check TypeScript
        run: bash ops/deploy/build-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-release
          path: |
            .deployment/release.tar.gz
            .deployment/release.sha256
          retention-days: 7
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_PAGER: ''
      LIGHTSAIL_INSTANCE: ${{ vars.LIGHTSAIL_INSTANCE }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      PRODUCTION_URL: https://www.agent.press
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-release
          path: .deployment
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          mask-aws-account-id: true
          role-session-name: website-${{ github.run_id }}
      - name: Deploy candidate, verify production, and roll back on failure
        timeout-minutes: 8
        run: bash ops/deploy/deploy-release.sh
      - name: Remove temporary runner SSH access if interrupted
        if: always() && env.DEPLOY_RUNNER_CIDR != ''
        run: |
          aws lightsail close-instance-public-ports             --instance-name "$LIGHTSAIL_INSTANCE"             --port-info "{\"fromPort\":22,\"toPort\":22,\"protocol\":\"tcp\",\"cidrs\":[\"$DEPLOY_RUNNER_CIDR\"]}" >/dev/null
      - name: Upload deployment verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-verification
          path: .deployment/*verification.json
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: ignore
